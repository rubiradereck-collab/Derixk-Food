<div class="container py-5" style="min-height: calc(100vh - 80px);">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="login-obsidian-card rounded-4 p-4 p-md-5 animate__animated animate__fadeInDown">
        <div class="text-center mb-4">
          <img
            src="assets/img/derixk-food-logo.jpg"
            alt="Derixk Food"
            class="login-logo-img rounded-4 mb-3 shadow-lg"
          />
          <h4 class="fw-bold text-white mb-1">Acceso al Personal</h4>
          <p class="text-secondary small mb-0">Derixk Food &bull; Sistema POS UTMACH</p>
        </div>

        @if (errorMensaje) {
          <div class="alert alert-danger py-2 px-3 small rounded-3 d-flex align-items-center mb-3">
            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
            <div>{{ errorMensaje }}</div>
          </div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="fa-solid fa-envelope"></i>
              </span>
              <input
                type="email"
                name="email"
                class="form-control"
                [(ngModel)]="email"
                #emailInput="ngModel"
                required
                email
                placeholder="admin@restaurante.ec"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="fa-solid fa-key"></i>
              </span>
              <input
                type="password"
                name="password"
                class="form-control"
                [(ngModel)]="password"
                #passInput="ngModel"
                required
                placeholder="••••••••"
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-coral w-100 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2"
            [disabled]="loginForm.invalid || cargando"
          >
            @if (cargando) {
              <span class="spinner-border spinner-border-sm"></span> Autenticando...
            } @else {
              <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            }
          </button>
        </form>

        <!-- Accesos directos de evaluación -->
        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
          <span class="text-secondary small d-block mb-2">Accesos rápidos para evaluación docente:</span>
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-pos px-3" (click)="rellenarAdmin()">
              <i class="fa-solid fa-user-shield me-1 text-warning"></i> Admin
            </button>
            <button type="button" class="btn btn-sm btn-outline-pos px-3" (click)="rellenarMesero()">
              <i class="fa-solid fa-user-tie me-1 text-info"></i> Mesero
            </button>
            <button type="button" class="btn btn-sm btn-outline-pos px-3" (click)="rellenarCocina()">
              <i class="fa-solid fa-fire-burner me-1 text-danger"></i> Cocina
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
