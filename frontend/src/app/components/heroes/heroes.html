<h1>
    Heroes <small>Marvel y DC</small></h1>
<hr>

<div class="row">
    <div class="col-md-4 mb-3 d-flex align-items-stretch" *ngFor="let heroe of heroes">

        <div class="card w-100">

            <img [src]="heroe.img" class="card-img-top" [alt]="heroe.nombre">

            <div class="card-body d-flex flex-column">

                <h5 class="card-title">{{ heroe.nombre }}</h5>

                <p class="card-text">{{ heroe.bio }}</p>

                <p>
                    <strong>Casa:</strong> {{ heroe.casa }}
                </p>


                <div class="card-footer text-body-secondary mt-auto">
                    Fecha de aparición: {{ heroe.aparicion }}
                </div>

                <a href="#" class="btn btn-primary mt-2 align-self-start">
                    Ver más
                </a>

            </div>
        </div>
    </div>
</div>
